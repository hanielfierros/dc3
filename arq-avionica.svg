<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="C · Arquitectura de aviónica y visualización"><rect width="1200" height="420" fill="#0a111f"/><defs><marker id="f" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5a6b7b"/></marker></defs><text x="40" y="34" fill="#e6edf4" font-family="sans-serif" font-size="18" font-weight="bold">C · Arquitectura de aviónica y visualización</text><text x="40" y="58" fill="#8ea3ba" font-family="sans-serif" font-size="12">Relación entre el panel físico, las pantallas y los componentes previstos. No se asume que todos estén instalados.</text><rect x="20" y="150" width="180" height="70" rx="8" fill="#0c1622" stroke="#1686c9" stroke-width="2"/><text x="110" y="189" fill="#e6edf4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Panel físico</text><rect x="20" y="280" width="180" height="70" rx="8" fill="#0c1622" stroke="#ff9800" stroke-width="2"/><text x="110" y="319" fill="#e6edf4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Pantallas detrás del panel</text><rect x="300" y="150" width="210" height="70" rx="8" fill="#0c1622" stroke="#ff9800" stroke-width="2"/><text x="405" y="183" fill="#e6edf4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Garmin GTN 750</text><text x="405" y="199" fill="#8ea3ba" font-family="sans-serif" font-size="10" text-anchor="middle">Previsto</text><rect x="300" y="280" width="210" height="70" rx="8" fill="#0c1622" stroke="#5a6b7b" stroke-width="2" stroke-dasharray="6 4"/><text x="405" y="319" fill="#e6edf4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Autopiloto</text><rect x="610" y="150" width="210" height="70" rx="8" fill="#0c1622" stroke="#1686c9" stroke-width="2"/><text x="715" y="183" fill="#e6edf4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Componentes descritos</text><text x="715" y="199" fill="#8ea3ba" font-family="sans-serif" font-size="10" text-anchor="middle">en documentación</text><rect x="610" y="280" width="210" height="70" rx="8" fill="#0c1622" stroke="#ff9800" stroke-width="2"/><text x="715" y="319" fill="#e6edf4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Instrumentos y LEDs</text><rect x="880" y="210" width="190" height="70" rx="8" fill="#0c1622" stroke="#2f7d4f" stroke-width="2" stroke-dasharray="3 3"/><text x="975" y="243" fill="#e6edf4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Opcionales</text><text x="975" y="259" fill="#8ea3ba" font-family="sans-serif" font-size="10" text-anchor="middle">por definir</text><line x1="200" y1="185" x2="300" y2="185" stroke="#5a6b7b" stroke-width="2" marker-end="url(#f)"/><line x1="200" y1="315" x2="300" y2="315" stroke="#5a6b7b" stroke-width="2" marker-end="url(#f)"/><line x1="510" y1="185" x2="610" y2="185" stroke="#5a6b7b" stroke-width="2" marker-end="url(#f)"/><line x1="510" y1="315" x2="610" y2="315" stroke="#5a6b7b" stroke-width="2" marker-end="url(#f)"/><line x1="820" y1="185" x2="880" y2="230" stroke="#5a6b7b" stroke-width="2" marker-end="url(#f)"/><line x1="820" y1="315" x2="880" y2="255" stroke="#5a6b7b" stroke-width="2" marker-end="url(#f)"/><text x="40" y="400" fill="#8ea3ba" font-family="sans-serif" font-size="11">Leyenda: <tspan fill="#1686c9">Documentado</tspan> · <tspan fill="#ff9800">Previsto</tspan> · <tspan fill="#5a6b7b">Pendiente de confirmar</tspan> · <tspan fill="#2f7d4f">Opcional</tspan></text><text x="40" y="378" fill="#5f7487" font-family="sans-serif" font-size="11">Los componentes reales frente a los simulados se confirmarán con la documentación de cada equipo.</text></svg>