<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-label="D · Arquitectura de software y comunicaciones"><rect width="1200" height="430" fill="#0a111f"/><defs><marker id="f" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5a6b7b"/></marker></defs><text x="40" y="34" fill="#e6edf4" font-family="sans-serif" font-size="18" font-weight="bold">D · Arquitectura de software y comunicaciones</text><text x="40" y="58" fill="#8ea3ba" font-family="sans-serif" font-size="12">Cadena de herramientas y puentes de comunicación. La dirección de los datos solo se marca cuando está verificada.</text><rect x="20" y="150" width="180" height="70" rx="8" fill="#0c1622" stroke="#1686c9" stroke-width="2"/><text x="110" y="183" fill="#e6edf4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Arduino IDE</text><text x="110" y="199" fill="#8ea3ba" font-family="sans-serif" font-size="10" text-anchor="middle">Programación</text><rect x="250" y="150" width="170" height="70" rx="8" fill="#0c1622" stroke="#ff9800" stroke-width="2"/><text x="335" y="189" fill="#e6edf4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Firmware</text><rect x="250" y="280" width="170" height="70" rx="8" fill="#0c1622" stroke="#5a6b7b" stroke-width="2" stroke-dasharray="6 4"/><text x="335" y="319" fill="#e6edf4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">XPLDirect / XPL Pro</text><rect x="470" y="280" width="170" height="70" rx="8" fill="#0c1622" stroke="#2f7d4f" stroke-width="2" stroke-dasharray="3 3"/><text x="555" y="319" fill="#e6edf4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">MobiFlight</text><rect x="470" y="150" width="170" height="70" rx="8" fill="#0c1622" stroke="#ff9800" stroke-width="2"/><text x="555" y="189" fill="#e6edf4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">X-Plane 12</text><rect x="700" y="150" width="210" height="70" rx="8" fill="#0c1622" stroke="#5a6b7b" stroke-width="2" stroke-dasharray="6 4"/><text x="805" y="183" fill="#e6edf4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Puente de comunicación</text><text x="805" y="199" fill="#8ea3ba" font-family="sans-serif" font-size="10" text-anchor="middle">por verificar</text><rect x="700" y="280" width="210" height="70" rx="8" fill="#0c1622" stroke="#ff9800" stroke-width="2"/><text x="805" y="313" fill="#e6edf4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Aplicaciones</text><text x="805" y="329" fill="#8ea3ba" font-family="sans-serif" font-size="10" text-anchor="middle">GTN 750 / G1000</text><line x1="200" y1="185" x2="250" y2="185" stroke="#5a6b7b" stroke-width="2" marker-end="url(#f)"/><line x1="420" y1="185" x2="470" y2="185" stroke="#5a6b7b" stroke-width="2" marker-end="url(#f)"/><line x1="640" y1="185" x2="700" y2="185" stroke="#5a6b7b" stroke-width="2" marker-end="url(#f)"/><line x1="420" y1="315" x2="470" y2="315" stroke="#5a6b7b" stroke-width="2" marker-end="url(#f)"/><line x1="640" y1="315" x2="700" y2="315" stroke="#5a6b7b" stroke-width="2" marker-end="url(#f)"/><text x="40" y="410" fill="#8ea3ba" font-family="sans-serif" font-size="11">Leyenda: <tspan fill="#1686c9">Documentado</tspan> · <tspan fill="#ff9800">Previsto</tspan> · <tspan fill="#5a6b7b">Pendiente de confirmar</tspan> · <tspan fill="#2f7d4f">Opcional</tspan></text><text x="40" y="388" fill="#5f7487" font-family="sans-serif" font-size="11">No se declara compatibilidad entre herramientas hasta verificarla; MobiFlight figura como opcional.</text></svg>