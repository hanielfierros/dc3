<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-label="A · Arquitectura general del simulador"><rect width="1200" height="440" fill="#0a111f"/><defs><marker id="f" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5a6b7b"/></marker></defs><text x="40" y="34" fill="#e6edf4" font-family="sans-serif" font-size="18" font-weight="bold">A · Arquitectura general del simulador</text><text x="40" y="58" fill="#8ea3ba" font-family="sans-serif" font-size="12">Flujo de señal desde la cabina física hasta la visualización; se distinguen elementos documentados, previstos y pendientes.</text><rect x="20" y="140" width="190" height="70" rx="8" fill="#0c1622" stroke="#1686c9" stroke-width="2"/><text x="115" y="173" fill="#e6edf4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Cabina DC-3 XB-DPC</text><text x="115" y="189" fill="#8ea3ba" font-family="sans-serif" font-size="10" text-anchor="middle">Aeronave en tierra</text><rect x="20" y="280" width="190" height="70" rx="8" fill="#0c1622" stroke="#1686c9" stroke-width="2"/><text x="115" y="319" fill="#e6edf4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Mandos físicos y sensores</text><rect x="300" y="200" width="210" height="70" rx="8" fill="#0c1622" stroke="#ff9800" stroke-width="2"/><text x="405" y="233" fill="#e6edf4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Microcontroladores</text><text x="405" y="249" fill="#8ea3ba" font-family="sans-serif" font-size="10" text-anchor="middle">Arduino Mega / Teensy</text><rect x="610" y="200" width="190" height="70" rx="8" fill="#0c1622" stroke="#1686c9" stroke-width="2"/><text x="705" y="239" fill="#e6edf4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">PC de simulación</text><rect x="880" y="140" width="170" height="70" rx="8" fill="#0c1622" stroke="#ff9800" stroke-width="2"/><text x="965" y="179" fill="#e6edf4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">X-Plane 12</text><rect x="880" y="260" width="170" height="70" rx="8" fill="#0c1622" stroke="#ff9800" stroke-width="2"/><text x="965" y="293" fill="#e6edf4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Modelo virtual</text><text x="965" y="309" fill="#8ea3ba" font-family="sans-serif" font-size="10" text-anchor="middle">King Air 90</text><rect x="620" y="350" width="200" height="70" rx="8" fill="#0c1622" stroke="#ff9800" stroke-width="2"/><text x="720" y="383" fill="#e6edf4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Pantallas de visualización</text><text x="720" y="399" fill="#8ea3ba" font-family="sans-serif" font-size="10" text-anchor="middle">3 monitores</text><line x1="210" y1="175" x2="210" y2="280" stroke="#5a6b7b" stroke-width="2" marker-end="url(#f)"/><line x1="210" y1="315" x2="300" y2="245" stroke="#5a6b7b" stroke-width="2" marker-end="url(#f)"/><line x1="510" y1="235" x2="610" y2="235" stroke="#5a6b7b" stroke-width="2" marker-end="url(#f)"/><line x1="800" y1="235" x2="880" y2="175" stroke="#5a6b7b" stroke-width="2" marker-end="url(#f)"/><line x1="800" y1="235" x2="880" y2="295" stroke="#5a6b7b" stroke-width="2" marker-end="url(#f)"/><line x1="965" y1="295" x2="720" y2="370" stroke="#5a6b7b" stroke-width="2" marker-end="url(#f)"/><text x="40" y="420" fill="#8ea3ba" font-family="sans-serif" font-size="11">Leyenda: <tspan fill="#1686c9">Documentado</tspan> · <tspan fill="#ff9800">Previsto</tspan> · <tspan fill="#5a6b7b">Pendiente de confirmar</tspan> · <tspan fill="#2f7d4f">Opcional</tspan></text><text x="40" y="398" fill="#5f7487" font-family="sans-serif" font-size="11">Los flujos de retroalimentación (X-Plane → microcontroladores) se representan en el diagrama F.</text></svg>