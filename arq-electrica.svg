<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-label="E · Arquitectura eléctrica y distribución de energía"><rect width="1200" height="430" fill="#0a111f"/><defs><marker id="f" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5a6b7b"/></marker></defs><text x="40" y="34" fill="#e6edf4" font-family="sans-serif" font-size="18" font-weight="bold">E · Arquitectura eléctrica y distribución de energía</text><text x="40" y="58" fill="#8ea3ba" font-family="sans-serif" font-size="12">Distribución conceptual de energía. No se especifican tensiones, corrientes ni calibres por no estar verificados.</text><rect x="20" y="150" width="200" height="70" rx="8" fill="#0c1622" stroke="#5a6b7b" stroke-width="2" stroke-dasharray="6 4"/><text x="120" y="189" fill="#e6edf4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Fuentes de alimentación</text><rect x="20" y="280" width="200" height="70" rx="8" fill="#0c1622" stroke="#5a6b7b" stroke-width="2" stroke-dasharray="6 4"/><text x="120" y="313" fill="#e6edf4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Protecciones</text><text x="120" y="329" fill="#8ea3ba" font-family="sans-serif" font-size="10" text-anchor="middle">fusibles / breakers</text><rect x="300" y="200" width="200" height="70" rx="8" fill="#0c1622" stroke="#5a6b7b" stroke-width="2" stroke-dasharray="6 4"/><text x="400" y="239" fill="#e6edf4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Distribución</text><rect x="580" y="130" width="200" height="70" rx="8" fill="#0c1622" stroke="#ff9800" stroke-width="2"/><text x="680" y="169" fill="#e6edf4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Alimentación de PC</text><rect x="580" y="260" width="200" height="70" rx="8" fill="#0c1622" stroke="#ff9800" stroke-width="2"/><text x="680" y="299" fill="#e6edf4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Alimentación electrónica</text><rect x="860" y="130" width="190" height="70" rx="8" fill="#0c1622" stroke="#5a6b7b" stroke-width="2" stroke-dasharray="6 4"/><text x="955" y="169" fill="#e6edf4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Tierras</text><rect x="860" y="260" width="190" height="70" rx="8" fill="#0c1622" stroke="#5a6b7b" stroke-width="2" stroke-dasharray="6 4"/><text x="955" y="299" fill="#e6edf4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Cableado</text><line x1="220" y1="185" x2="300" y2="220" stroke="#5a6b7b" stroke-width="2" marker-end="url(#f)"/><line x1="220" y1="315" x2="300" y2="245" stroke="#5a6b7b" stroke-width="2" marker-end="url(#f)"/><line x1="500" y1="225" x2="580" y2="165" stroke="#5a6b7b" stroke-width="2" marker-end="url(#f)"/><line x1="500" y1="225" x2="580" y2="295" stroke="#5a6b7b" stroke-width="2" marker-end="url(#f)"/><line x1="780" y1="165" x2="860" y2="165" stroke="#5a6b7b" stroke-width="2" marker-end="url(#f)"/><line x1="780" y1="295" x2="860" y2="295" stroke="#5a6b7b" stroke-width="2" marker-end="url(#f)"/><text x="40" y="410" fill="#8ea3ba" font-family="sans-serif" font-size="11">Leyenda: <tspan fill="#1686c9">Documentado</tspan> · <tspan fill="#ff9800">Previsto</tspan> · <tspan fill="#5a6b7b">Pendiente de confirmar</tspan> · <tspan fill="#2f7d4f">Opcional</tspan></text><text x="40" y="388" fill="#5f7487" font-family="sans-serif" font-size="11">Especificaciones (tensión, corriente, calibre, fusibles) quedan como Pendiente de ingeniería/verificación.</text></svg>