<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-label="F · Flujo funcional de una sesión"><rect width="1200" height="440" fill="#0a111f"/><defs><marker id="f" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5a6b7b"/></marker></defs><text x="40" y="34" fill="#e6edf4" font-family="sans-serif" font-size="18" font-weight="bold">F · Flujo funcional de una sesión</text><text x="40" y="58" fill="#8ea3ba" font-family="sans-serif" font-size="12">Secuencia de interacción de una sesión de simulación, con retroalimentación al usuario.</text><rect x="20" y="200" width="180" height="70" rx="8" fill="#0c1622" stroke="#1686c9" stroke-width="2"/><text x="110" y="239" fill="#e6edf4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Acción del usuario</text><rect x="240" y="200" width="180" height="70" rx="8" fill="#0c1622" stroke="#ff9800" stroke-width="2"/><text x="330" y="239" fill="#e6edf4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Captación del mando</text><rect x="460" y="200" width="180" height="70" rx="8" fill="#0c1622" stroke="#ff9800" stroke-width="2"/><text x="550" y="239" fill="#e6edf4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Lectura electrónica</text><rect x="680" y="200" width="180" height="70" rx="8" fill="#0c1622" stroke="#ff9800" stroke-width="2"/><text x="770" y="239" fill="#e6edf4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Envío de datos</text><rect x="900" y="200" width="190" height="70" rx="8" fill="#0c1622" stroke="#ff9800" stroke-width="2"/><text x="995" y="239" fill="#e6edf4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Respuesta de X-Plane</text><rect x="900" y="340" width="190" height="70" rx="8" fill="#0c1622" stroke="#ff9800" stroke-width="2"/><text x="995" y="379" fill="#e6edf4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Visualización</text><rect x="240" y="340" width="210" height="70" rx="8" fill="#0c1622" stroke="#ff9800" stroke-width="2"/><text x="345" y="379" fill="#e6edf4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Retroalimentación al usuario</text><line x1="200" y1="235" x2="240" y2="235" stroke="#5a6b7b" stroke-width="2" marker-end="url(#f)"/><line x1="420" y1="235" x2="460" y2="235" stroke="#5a6b7b" stroke-width="2" marker-end="url(#f)"/><line x1="640" y1="235" x2="680" y2="235" stroke="#5a6b7b" stroke-width="2" marker-end="url(#f)"/><line x1="860" y1="235" x2="900" y2="235" stroke="#5a6b7b" stroke-width="2" marker-end="url(#f)"/><line x1="995" y1="270" x2="995" y2="340" stroke="#5a6b7b" stroke-width="2" marker-end="url(#f)"/><line x1="995" y1="375" x2="450" y2="375" stroke="#5a6b7b" stroke-width="2" marker-end="url(#f)"/><text x="40" y="420" fill="#8ea3ba" font-family="sans-serif" font-size="11">Leyenda: <tspan fill="#1686c9">Documentado</tspan> · <tspan fill="#ff9800">Previsto</tspan> · <tspan fill="#5a6b7b">Pendiente de confirmar</tspan> · <tspan fill="#2f7d4f">Opcional</tspan></text><text x="40" y="398" fill="#5f7487" font-family="sans-serif" font-size="11">Los tramos de captación y envío requieren integración y pruebas antes de confirmarse.</text></svg>