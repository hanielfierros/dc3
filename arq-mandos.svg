<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-label="B · Arquitectura de mandos y sensorización"><rect width="1200" height="430" fill="#0a111f"/><defs><marker id="f" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5a6b7b"/></marker></defs><text x="40" y="34" fill="#e6edf4" font-family="sans-serif" font-size="18" font-weight="bold">B · Arquitectura de mandos y sensorización</text><text x="40" y="58" fill="#8ea3ba" font-family="sans-serif" font-size="12">Entradas y salidas físicas vinculadas a los microcontroladores. Los elementos pendientes no se asumen instalados.</text><rect x="20" y="120" width="190" height="60" rx="8" fill="#0c1622" stroke="#1686c9" stroke-width="2"/><text x="115" y="154" fill="#e6edf4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Volante / yoke</text><rect x="20" y="210" width="190" height="60" rx="8" fill="#0c1622" stroke="#ff9800" stroke-width="2"/><text x="115" y="244" fill="#e6edf4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Pedales de timón</text><rect x="20" y="300" width="190" height="60" rx="8" fill="#0c1622" stroke="#5a6b7b" stroke-width="2" stroke-dasharray="6 4"/><text x="115" y="334" fill="#e6edf4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Palancas (flaps, tren)</text><rect x="250" y="120" width="190" height="60" rx="8" fill="#0c1622" stroke="#ff9800" stroke-width="2"/><text x="345" y="154" fill="#e6edf4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Interruptores y botones</text><rect x="250" y="210" width="190" height="60" rx="8" fill="#0c1622" stroke="#5a6b7b" stroke-width="2" stroke-dasharray="6 4"/><text x="345" y="244" fill="#e6edf4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Potenciómetros</text><rect x="250" y="300" width="190" height="60" rx="8" fill="#0c1622" stroke="#ff9800" stroke-width="2"/><text x="345" y="334" fill="#e6edf4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Sensores</text><rect x="560" y="200" width="220" height="80" rx="8" fill="#0c1622" stroke="#ff9800" stroke-width="2"/><text x="670" y="238" fill="#e6edf4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Arduino Mega</text><text x="670" y="254" fill="#8ea3ba" font-family="sans-serif" font-size="10" text-anchor="middle">Entradas/salidas</text><rect x="850" y="120" width="200" height="60" rx="8" fill="#0c1622" stroke="#ff9800" stroke-width="2"/><text x="950" y="154" fill="#e6edf4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Servos y actuadores</text><rect x="850" y="220" width="200" height="60" rx="8" fill="#0c1622" stroke="#5a6b7b" stroke-width="2" stroke-dasharray="6 4"/><text x="950" y="254" fill="#e6edf4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Luces e indicadores</text><rect x="850" y="320" width="200" height="60" rx="8" fill="#0c1622" stroke="#5a6b7b" stroke-width="2" stroke-dasharray="6 4"/><text x="950" y="348" fill="#e6edf4" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Interfaces</text><text x="950" y="364" fill="#8ea3ba" font-family="sans-serif" font-size="10" text-anchor="middle">USB / serie</text><line x1="210" y1="150" x2="250" y2="150" stroke="#5a6b7b" stroke-width="2" marker-end="url(#f)"/><line x1="210" y1="240" x2="250" y2="240" stroke="#5a6b7b" stroke-width="2" marker-end="url(#f)"/><line x1="210" y1="330" x2="250" y2="330" stroke="#5a6b7b" stroke-width="2" marker-end="url(#f)"/><line x1="440" y1="150" x2="560" y2="210" stroke="#5a6b7b" stroke-width="2" marker-end="url(#f)"/><line x1="440" y1="240" x2="560" y2="230" stroke="#5a6b7b" stroke-width="2" marker-end="url(#f)"/><line x1="440" y1="330" x2="560" y2="250" stroke="#5a6b7b" stroke-width="2" marker-end="url(#f)"/><line x1="780" y1="230" x2="850" y2="150" stroke="#5a6b7b" stroke-width="2" marker-end="url(#f)"/><line x1="780" y1="240" x2="850" y2="250" stroke="#5a6b7b" stroke-width="2" marker-end="url(#f)"/><line x1="780" y1="250" x2="850" y2="350" stroke="#5a6b7b" stroke-width="2" marker-end="url(#f)"/><text x="40" y="410" fill="#8ea3ba" font-family="sans-serif" font-size="11">Leyenda: <tspan fill="#1686c9">Documentado</tspan> · <tspan fill="#ff9800">Previsto</tspan> · <tspan fill="#5a6b7b">Pendiente de confirmar</tspan> · <tspan fill="#2f7d4f">Opcional</tspan></text><text x="40" y="388" fill="#5f7487" font-family="sans-serif" font-size="11">La asignación exacta de cada mando a cada pin está sujeta a verificación en la ingeniería de detalle.</text></svg>